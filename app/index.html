<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Movie Portal</title>
<style>
:root{--bg:#080d1b;--text:#f5f7ff;--muted:#b7c2dc;--accent:#7de4d2;--border:rgba(255,255,255,.22)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{background:radial-gradient(ellipse at 50% 0%,#25395d 0%,var(--bg) 62%)}
.shell{min-height:100vh;padding:5vh 6vw 4vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{display:flex;align-items:center;gap:18px}
.brandmark{width:64px;height:64px;flex:0 0 64px;border-radius:18px;display:grid;place-items:center;font-size:32px;font-weight:bold;color:#07111d;background:linear-gradient(135deg,var(--accent),#9eb6ff)}
h1{font-size:clamp(30px,3.4vw,48px);margin:0 0 7px;letter-spacing:-.04em}
.subtitle{color:var(--muted);font-size:clamp(15px,1.4vw,20px)}
.clock{text-align:right;color:var(--muted);font-size:clamp(14px,1.2vw,18px);white-space:nowrap}
.clock strong{display:block;font-size:clamp(26px,2.5vw,38px);color:var(--text);font-weight:600;margin-bottom:4px}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:4vh 0;gap:22px}
.portal-tile{width:100%;min-height:35vh;padding:clamp(26px,4vw,58px);border:3px solid var(--border);border-radius:30px;background:linear-gradient(135deg,rgba(125,228,210,.18),rgba(158,182,255,.10) 55%,rgba(255,255,255,.04));display:flex;align-items:center;justify-content:space-between;gap:28px;color:var(--text);text-align:left;cursor:pointer;outline:none;transition:transform .12s,border-color .12s,background .12s,box-shadow .12s}
.portal-tile:focus,.portal-tile:focus-visible,.setting:focus,.setting:focus-visible{border-color:var(--accent);background:linear-gradient(135deg,rgba(125,228,210,.28),rgba(158,182,255,.18));transform:scale(1.012);box-shadow:0 0 0 5px rgba(125,228,210,.18),0 20px 70px rgba(0,0,0,.25)}
.tile-copy{display:flex;flex-direction:column;gap:14px}
.eyebrow{color:var(--accent);font-size:clamp(13px,1.2vw,17px);font-weight:bold;text-transform:uppercase;letter-spacing:.14em}
.tile-title{font-size:clamp(34px,5vw,68px);font-weight:700;letter-spacing:-.04em}
.tile-description{color:var(--muted);font-size:clamp(16px,1.6vw,23px)}
.tile-icon{width:clamp(92px,12vw,160px);height:clamp(92px,12vw,160px);flex:0 0 auto;border-radius:28px;display:grid;place-items:center;font-size:clamp(48px,7vw,88px);background:rgba(125,228,210,.14);border:1px solid rgba(125,228,210,.25)}
.setting{width:100%;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:22px 28px;border:2px solid var(--border);border-radius:20px;background:rgba(255,255,255,.045);color:var(--text);text-align:left;cursor:pointer;outline:none}
.setting-copy{display:flex;flex-direction:column;gap:7px}
.setting-title{font-size:clamp(17px,1.7vw,24px);font-weight:700}
.setting-description{color:var(--muted);font-size:clamp(13px,1.15vw,17px)}
.switch{flex:0 0 auto;width:72px;height:38px;border-radius:30px;background:#4b5871;padding:4px;transition:background .15s}
.switch::after{content:"";display:block;width:30px;height:30px;border-radius:50%;background:white;transition:transform .15s}
.setting[aria-checked="true"] .switch{background:#2aaf98}
.setting[aria-checked="true"] .switch::after{transform:translateX(34px)}
.hint{color:var(--muted);font-size:clamp(12px,1.05vw,15px);text-align:center;margin:0}
footer{display:flex;justify-content:space-between;gap:18px;color:var(--muted);font-size:clamp(12px,1vw,15px)}
@media(max-width:700px){.shell{padding:24px}.clock{display:none}.portal-tile{min-height:30vh;padding:24px;border-radius:22px;gap:14px}.tile-icon{width:74px;height:74px;flex-basis:74px;border-radius:18px;font-size:40px}.tile-title{font-size:clamp(30px,8vw,48px)}.setting{padding:18px}.switch{width:62px}.setting[aria-checked="true"] .switch::after{transform:translateX(24px)}}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand">
      <div class="brandmark" aria-hidden="true">▶</div>
      <div><h1>Movie Portal</h1><div class="subtitle">Your movie destination.</div></div>
    </div>
    <div class="clock" aria-label="Current time"><strong id="time">--:--</strong><span id="date">Ready to watch</span></div>
  </header>
  <main>
    <button class="portal-tile" id="openMovies" type="button" aria-label="Open Movies.do">
      <span class="tile-copy">
        <span class="eyebrow">Your portal</span>
        <span class="tile-title">Movies.do</span>
        <span class="tile-description">Select to browse and watch movies</span>
      </span>
      <span class="tile-icon" aria-hidden="true">🎬</span>
    </button>
    <button class="setting" id="autoOpen" type="button" role="switch" aria-checked="false">
      <span class="setting-copy">
        <span class="setting-title">Open Movies.do automatically</span>
        <span class="setting-description" id="settingDescription">Off — show this launcher when Movie Portal starts.</span>
      </span>
      <span class="switch" aria-hidden="true"></span>
    </button>
    <p class="hint">Use the remote arrows to move between controls, then press Enter / Select.</p>
  </main>
  <footer><span>Movie Portal</span><span>One website · TV remote friendly</span></footer>
</div>
<script>
(function(){
  "use strict";
  var target="https://movies.do/home";
  var storageKey="movie-portal-auto-open";
  var tile=document.getElementById("openMovies");
  var setting=document.getElementById("autoOpen");
  var description=document.getElementById("settingDescription");

  function getAutoOpen(){
    try{return window.localStorage.getItem(storageKey)==="true";}catch(e){return false;}
  }
  function updateSetting(){
    var enabled=getAutoOpen();
    setting.setAttribute("aria-checked",enabled?"true":"false");
    description.textContent=enabled
      ?"On — Movie Portal will open Movies.do automatically next time."
      :"Off — show this launcher when Movie Portal starts.";
  }
  function openMovies(){window.location.href=target;}
  tile.addEventListener("click",openMovies);
  setting.addEventListener("click",function(){
    var next=!getAutoOpen();
    try{window.localStorage.setItem(storageKey,next?"true":"false");}catch(e){}
    updateSetting();
  });
  function updateClock(){
    var now=new Date();
    try{
      document.getElementById("time").textContent=now.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
      document.getElementById("date").textContent=now.toLocaleDateString([], {weekday:"short",month:"short",day:"numeric"});
    }catch(e){
      document.getElementById("time").textContent=now.getHours()+":"+("0"+now.getMinutes()).slice(-2);
      document.getElementById("date").textContent="Ready to watch";
    }
  }
  updateSetting();
  updateClock();
  window.setInterval(updateClock,30000);

  // First launch shows the launcher. Auto-open applies on later launches only.
  if(getAutoOpen()){
    window.setTimeout(function(){window.location.href=target;},350);
  }else{
    window.addEventListener("load",function(){
      window.setTimeout(function(){tile.focus();},250);
    });
  }
})();
</script>
</body>
</html>
